name: CI

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Generate coverage CSV
        run: |
          echo "File,Function,Coverage" > coverage.csv
          go tool cover -func=coverage.out | awk 'OFS="," {print $1, $2, $3}' >> coverage.csv

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.csv
